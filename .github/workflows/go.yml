name: Build Go

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install libmpv and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev pkg-config ffmpeg

      - name: Portable preflight (format, modules, race tests, vet, web, builds)
        run: task ci

      - name: Native preflight (libmpv builds, vet, race tests, generated-media playback)
        run: task ci-native

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Playwright
        run: task dev-deps

      - name: Chrome playback and control tests
        run: task test-browser
